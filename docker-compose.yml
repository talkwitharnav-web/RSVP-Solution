services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rsvp_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rsvp-postgres-data:/var/lib/postgresql/data

volumes:
  rsvp-postgres-data:
